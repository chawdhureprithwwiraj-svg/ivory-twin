<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#170A21">
  <title>Ivory House — The Member House</title>
  <meta name="description" content="The Ivory member house on the web: films, radio, bell, vault, gilded hours — the same house as the app.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { margin: 0; padding: 0; background: #170A21; height: 100%; }
    .ivory-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #170A21;
      color: #FFE9B8; font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 0.24em; text-align: center; z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .ivory-boot .lamp { font-size: 2rem; animation: glow 1.6s ease-in-out infinite alternate; }
    .ivory-boot .name { margin-top: 0.8rem; font-size: 0.95rem; font-weight: 700; }
    .ivory-boot .line { margin-top: 0.4rem; font-size: 0.7rem; opacity: 0.65; letter-spacing: 0.3em; }
    @keyframes glow { from { opacity: 0.45; } to { opacity: 1; } }
    .ivory-boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="ivory-boot" id="ivory-boot">
    <div class="lamp">✦</div>
    <div class="name">IVORY HOUSE</div>
    <div class="line">OPENING THE DOOR</div>
  </div>
  <script>
    // CC.240: never serve yesterday's house. When a new deploy takes
    // the wheel, the service worker hands over and the page reloads
    // itself once, so the member always walks the newest rooms.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!window.__ivorySwReload) { window.__ivorySwReload = 1; window.location.reload(); }
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) { reg.update(); }
        });
      });
    }
  </script>
  <script>
    // CC.244: a phone's browser reports a pixel ratio of 2.6 to 3. At
    // that ratio the house paints two and a half million pixels every
    // frame - and CanvasKit has to fill every one of them on the GPU of
    // a phone browser. Capping the ratio is the single largest saving
    // available, because cost rises with the SQUARE of the ratio.
    //   1.75 -> about 45% of the pixels, edges still clean
    //   1.50 -> about 33% of the pixels, edges a touch softer
    // Change the number below if you want to tune it by eye.
    (function () {
      var IVORY_MAX_DPR = 1.75;
      try {
        var real = window.devicePixelRatio || 1;
        if (real > IVORY_MAX_DPR) {
          Object.defineProperty(window, 'devicePixelRatio', {
            get: function () { return IVORY_MAX_DPR; },
            configurable: true
          });
        }
      } catch (e) { /* an older browser keeps its own ratio */ }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('ivory-boot');
      if (b) { b.classList.add('hide'); setTimeout(function(){ b.remove(); }, 600); }
    });
  </script>
</body>
</html>
