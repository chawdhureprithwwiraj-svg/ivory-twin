name: Deploy the Admin B2 object door

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/functions/b2-object-admin/index.ts
      - supabase/config.toml
      - .github/workflows/deploy_b2_object_admin.yml

permissions:
  contents: read

concurrency:
  group: supabase-b2-object-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: soephrftgddbwkzwjddj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Check the deployment boundary
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not available to this workflow. No function was deployed."
            exit 1
          fi
          test -f supabase/functions/b2-object-admin/index.ts
          grep -q '^\[functions.b2-object-admin\]$' supabase/config.toml
      - name: Deploy only the new companion
        run: supabase functions deploy b2-object-admin --project-ref "$PROJECT_REF"
