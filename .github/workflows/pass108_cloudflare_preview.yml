name: Pass-108 Cloudflare Pages preview (non-production)

on:
  push:
    branches:
      - pass108-cloudflare-preview

permissions:
  contents: read

concurrency:
  group: pass108-cloudflare-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check out the isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: pass108-cloudflare-preview

      - name: Confirm credentials and production isolation before upload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare Action secrets are unavailable; no deployment was attempted."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          def stop(message):
              print('::error::' + message)
              raise SystemExit(1)
          account = os.environ.get('CF_ACCOUNT_ID', '')
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', account):
              stop('CF_ACCOUNT_ID has an invalid shape; no deployment was attempted.')
          url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/ivory-twin'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'ivory-pass108-preview-preflight'})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as error:
              stop('Cloudflare Pages project lookup returned HTTP %s; no deployment was attempted.' % error.code)
          except Exception:
              stop('Cloudflare Pages project lookup failed; no deployment was attempted.')
          if payload.get('success') is not True:
              stop('Cloudflare rejected the project lookup; no deployment was attempted.')
          project = payload.get('result') or {}
          if project.get('name') != 'ivory-twin':
              stop('The expected Pages project was not confirmed; no deployment was attempted.')
          production = project.get('production_branch')
          if production != 'main':
              stop('Expected production branch "main" was not confirmed; refusing to deploy any preview.')
          domains = project.get('domains') or []
          if 'ivoryhouse.dpdns.org' not in domains:
              stop('The custom domain is not attached to the expected project; no deployment was attempted.')
          preview = 'pass108-cloudflare-preview'
          if preview == production:
              stop('Preview branch equals production branch; refusing deployment.')
          print('Preflight confirmed Pages project=ivory-twin; production_branch=main; custom_domain_attached=true; requested_branch=' + preview + '.')
          print('Only a non-production branch deployment will be attempted.')
          PY

      - name: Verify the exact Pass-108 payload and assemble static files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          manifest = json.loads(Path('.github/pass108_cloudflare_stage_manifest.json').read_text())
          files = manifest.get('files') or []
          if manifest.get('payload_files') != 91 or len(files) != 91 or manifest.get('payload_bytes') != 36835553:
              raise SystemExit('::error::Unexpected Pass-108 payload manifest; refusing deployment.')
          if manifest.get('candidate') != {'path': 'index.html', 'bytes': 3165601, 'sha256': '975f7319f616d58862b444beae828b9d638d2596538db233112ad5cfde831d44'}:
              raise SystemExit('::error::Candidate identity changed; refusing deployment.')
          shutil.rmtree('dist', ignore_errors=True)
          Path('dist').mkdir()
          seen = set()
          for item in files:
              rel = item.get('path', '')
              source = Path(rel)
              if not rel or rel in seen or source.is_absolute() or '..' in source.parts:
                  raise SystemExit('::error::Unsafe or duplicate manifest path; refusing deployment.')
              seen.add(rel)
              if not source.is_file():
                  raise SystemExit('::error::Required candidate file missing: ' + rel)
              data = source.read_bytes()
              if len(data) != item.get('bytes') or hashlib.sha256(data).hexdigest() != item.get('sha256'):
                  raise SystemExit('::error::Candidate file differs from the verified manifest: ' + rel)
              if rel.startswith('functions/'):
                  continue
              dest = Path('dist') / source
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, dest)
          if not Path('functions/api/b2-media.js').is_file() or not Path('functions/api/r2-vault.js').is_file():
              raise SystemExit('::error::Cloudflare Pages Functions missing at project root; refusing deployment.')
          print('Verified 91 files / 36,835,553 bytes and the exact Pass-108 page hash.')
          print('Assembled static assets under dist/; left functions/ at the Pages project root.')
          PY

      - name: Deploy the preview branch only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler pages deploy dist \
            --project-name ivory-twin \
            --branch pass108-cloudflare-preview \
            --commit-dirty=true

      - name: Record preview deployment and production rollback target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request
          account = os.environ['CF_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/ivory-twin/deployments'
          def get_env(environment):
              query = urllib.parse.urlencode({'env': environment, 'per_page': 20})
              request = urllib.request.Request(base + '?' + query, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'ivory-pass108-preview-receipt'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read())
              except urllib.error.HTTPError as error:
                  try:
                      body = json.loads(error.read())
                      detail = '; '.join(str(x.get('message', '')) for x in body.get('errors', []) if x.get('message'))
                  except Exception:
                      detail = ''
                  raise SystemExit('::error::Cloudflare deployment metadata HTTP %s%s' % (error.code, (': ' + detail[:240]) if detail else ''))
              if data.get('success') is not True:
                  raise RuntimeError('Cloudflare deployment metadata lookup failed')
              return data.get('result') or []
          def safe_url(value):
              if not isinstance(value, str): return ''
              if not re.fullmatch(r'https://[A-Za-z0-9.-]+\.ivory-twin\.pages\.dev/?', value):
                  return ''
              return value
          production = [x for x in get_env('production') if (x.get('latest_stage') or {}).get('status') == 'success' and not x.get('is_skipped')]
          if not production:
              raise SystemExit('::error::No successful production rollback target was found.')
          rollback = max(production, key=lambda x: x.get('created_on') or '')
          metadata = (rollback.get('deployment_trigger') or {}).get('metadata') or {}
          if metadata.get('branch') != 'main':
              raise SystemExit('::error::Latest successful production target is not from main; stopping.')
          previews = [x for x in get_env('preview') if (x.get('latest_stage') or {}).get('status') == 'success' and not x.get('is_skipped')]
          branch = 'pass108-cloudflare-preview'
          stage = [x for x in previews if ((x.get('deployment_trigger') or {}).get('metadata') or {}).get('branch') == branch]
          if not stage:
              raise SystemExit('::error::Successful Cloudflare preview deployment was not found.')
          preview = max(stage, key=lambda x: x.get('created_on') or '')
          aliases = [safe_url(x) for x in (preview.get('aliases') or [])]
          aliases = [x for x in aliases if x]
          preview_url = 'https://pass108-cloudflare-preview.ivory-twin.pages.dev/'
          if preview_url.rstrip('/') not in [x.rstrip('/') for x in aliases] and safe_url(preview.get('url')) != preview_url.rstrip('/'):
              raise SystemExit('::error::Expected preview alias was not confirmed; stopping.')
          rollback_id = rollback.get('id') or ''
          preview_id = preview.get('id') or ''
          if not rollback_id or not preview_id:
              raise SystemExit('::error::Deployment IDs were missing; stopping.')
          lines = [
              '## Pass-108 Cloudflare staging receipt',
              '- Preview URL: ' + preview_url,
              '- Preview deployment ID: `' + preview_id + '`; branch: `' + branch + '`; status: `success`.',
              '- Production branch: `main`; custom domain remains attached to the existing project.',
              '- Current successful production rollback target: `' + rollback_id + '`; created: `' + str(rollback.get('created_on') or 'unknown') + '`; URL: `' + safe_url(rollback.get('url')) + '`.',
              '- The workflow deployed only the preview branch; no production deployment or DNS change was requested.'
          ]
          print('\n'.join(lines))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as output:
                  output.write('\n'.join(lines) + '\n')
          PY
